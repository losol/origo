name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Publishing uses npm trusted publishing (OIDC), so no NPM token is needed —
    # but npm must list this repo *and this workflow file* as a trusted
    # publisher for each package.
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pending changesets -> open/update the "Version Packages" PR.
      # No pending changesets but unreleased versions -> publish them, then
      # push a git tag and create a GitHub release for each published package.
      # `pnpm release` builds the workspace before `changeset publish`, so no
      # package can be published without its compiled output.
      #
      # Action v2 requires Changesets CLI v3: it learns what was published from
      # the file the CLI writes to $CHANGESETS_OUTPUT, which `pnpm release`
      # inherits from the action's environment.
      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NPM_CONFIG_PROVENANCE: true
